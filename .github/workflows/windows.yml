name: Windows build

# Builds Nacre.exe (PyInstaller: Python, Qt and Chromium bundled), launches it once as a smoke test, then packs
# Nacre-Setup-<version>.exe (Inno Setup, per-user, no admin) and a portable zip.
# Manual runs keep the files as workflow artifacts; pushing a tag like v0.1.0 also publishes a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev.${{ github.run_number }}" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Building Nacre $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller qrcode

      - name: Fonts and icon
        run: |
          python scripts/fetch_fonts.py
          python -c "from PIL import Image; Image.open('assets/nacre.png').save('assets/nacre.ico', sizes=[(s, s) for s in (16, 24, 32, 48, 64, 128, 256)])"

      - name: Build Nacre.exe
        run: pyinstaller --noconfirm --clean packaging/nacre.spec

      - name: Smoke test
        run: |
          $out = (New-Item -ItemType Directory -Force smoke).FullName
          foreach ($v in "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_CACHE_HOME") {
            Set-Item "env:$v" (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP $v)).FullName
          }
          $env:NACRE_SMOKE_OUT = $out
          $env:NACRE_SCRIPT = (Resolve-Path packaging/smoke.py).Path
          $p = Start-Process dist/Nacre/Nacre.exe -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host "::warning::Nacre did not quit in time" }
          $crash = Join-Path $env:XDG_CACHE_HOME "nacre\crash.log"
          if (Test-Path $crash) { Copy-Item $crash $out; Get-Content $crash }
          if (-not (Test-Path (Join-Path $out "smoke.txt"))) { throw "Smoke test failed: Nacre never reported back" }
          Get-Content (Join-Path $out "smoke.txt")

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore

      - name: Installer and portable zip
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DVersion=$env:VERSION" packaging\nacre.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\Nacre -DestinationPath "dist\Nacre-$env:VERSION-portable.zip"
          Get-ChildItem dist -File | Format-Table Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB) } }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Nacre-${{ env.VERSION }}-windows
          path: |
            dist/Nacre-Setup-*.exe
            dist/Nacre-*-portable.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist\Nacre-Setup-*.exe).FullName `
            (Get-ChildItem dist\Nacre-*-portable.zip).FullName --title "Nacre $env:VERSION" --generate-notes
