name: Windows build

# Builds Nacre.exe (PyInstaller: Python, Qt and Chromium bundled), launches it once as a smoke test, then packs
# Nacre-Setup-<version>.exe (Inno Setup, per-user, no admin) and a portable zip.
# Manual runs keep the files as workflow artifacts; pushing a tag like v0.1.0 also publishes a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev.${{ github.run_number }}" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Building Nacre $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller qrcode

      - name: Fonts and icon
        run: |
          python scripts/fetch_fonts.py
          python -c "from PIL import Image; Image.open('assets/nacre.png').save('assets/nacre.ico', sizes=[(s, s) for s in (16, 24, 32, 48, 64, 128, 256)])"

      - name: Build Nacre.exe
        run: pyinstaller --noconfirm --clean packaging/nacre.spec

      - name: Smoke test
        run: |
          $exe = & packaging/smoke.ps1 exe dist\Nacre\Nacre.exe
          if (-not $exe) {
            # diagnose: which part breaks? (each variant runs from source)
            $env:NACRE_NO_WINFRAME = "1"; $env:NACRE_NO_MEDIAKEYS = "1"
            $nohooks = & packaging/smoke.ps1 source-no-native-hooks python run.py
            Remove-Item env:NACRE_NO_WINFRAME, env:NACRE_NO_MEDIAKEYS
            $env:QSG_RHI_BACKEND = "opengl"
            $gl = & packaging/smoke.ps1 source-opengl python run.py
            Remove-Item env:QSG_RHI_BACKEND
            git worktree add ..\old d3eaa8b 2>&1 | Out-Null
            Copy-Item -Recurse nacre\fonts ..\old\nacre\fonts -ErrorAction SilentlyContinue
            Push-Location ..\old
            $old = & $env:GITHUB_WORKSPACE\packaging\smoke.ps1 old-d3eaa8b python run.py
            Pop-Location
            Write-Host "no-native-hooks=$nohooks opengl=$gl old-commit=$old"
            throw "Smoke test failed: Nacre.exe never reported back"
          }

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore

      - name: Installer and portable zip
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DVersion=$env:VERSION" packaging\nacre.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\Nacre -DestinationPath "dist\Nacre-$env:VERSION-portable.zip"
          Get-ChildItem dist -File | Format-Table Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB) } }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Nacre-${{ env.VERSION }}-windows
          path: |
            dist/Nacre-Setup-*.exe
            dist/Nacre-*-portable.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist\Nacre-Setup-*.exe).FullName `
            (Get-ChildItem dist\Nacre-*-portable.zip).FullName --title "Nacre $env:VERSION" --generate-notes
